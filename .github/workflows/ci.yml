name: Nous enqueuer

on:
  pull_request:
    paths:
      - "enqueuer/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "README.md"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "enqueuer/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "README.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test-admin
          RABBITMQ_DEFAULT_PASS: test-admin-password
          RABBITMQ_DEFAULT_VHOST: ai
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
        env:
          RUN_RABBITMQ_INTEGRATION_TESTS: "true"
          RABBITMQ_TEST_HOST: 127.0.0.1
          RABBITMQ_TEST_PORT: 5672
          RABBITMQ_TEST_VHOST: ai
          RABBITMQ_TEST_USERNAME: test-admin
          RABBITMQ_TEST_PASSWORD: test-admin-password

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nous-enqueuer:sha-${{ github.sha }}
