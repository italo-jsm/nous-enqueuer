[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-enqueuer"
version = "0.1.0"
description = "Authenticated Telegram webhook that publishes confirmed messages to RabbitMQ"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
  "gunicorn==26.2.0",
  "pika==1.3.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["enqueuer*"]
